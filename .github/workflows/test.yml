name: Backend Tests

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: vms_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret
      JWT_EXPIRY: 1h

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable uuid-ossp extension
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d vms_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run Knex migrations
        run: npx knex migrate:latest --env test

      - name: Run backend tests
        run: npm test
